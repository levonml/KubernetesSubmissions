apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: the-project
spec:
  replicas: 1
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 0
     maxUnavailable: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      containers:
        - name: the-project
          image: levonml/2-10-the-project:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: the-project-config-map
          volumeMounts:
          - name: the-project-volume
            mountPath: /tmp/kube
          resources:
            requests:
              memory: "60Mi"
              cpu: "50m"
            limits:
              memory: "80Mi"
              cpu: "100m" 
      volumes:
        - name: the-project-volume
          persistentVolumeClaim:
            claimName: the-project-claim
        - name: the-project-config
          configMap:
            name: the-project-config-map