apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: the-project
spec:
  replicas: 1
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 0
     maxUnavailable: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      containers:
        - name: the-project
          image: PROJECT/IMAGE_FRONTEND
          imagePullPolicy: Always
          readinessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 5 # How often to test
            httpGet:
               path: /healthz
               port: 3000
          livenessProbe:
            initialDelaySeconds: 20 # Initial delay until the liveness is tested
            periodSeconds: 5 # How often to test
            httpGet:
               path: /healthz
               port: 3000
          envFrom:
            - configMapRef:
                name: the-project-config-map
          volumeMounts:
          - name: the-project-volume
            mountPath: /tmp/kube
      volumes:
        - name: the-project-volume
          persistentVolumeClaim:
            claimName: the-project-claim
        - name: the-project-config
          configMap:
            name: the-project-config-map