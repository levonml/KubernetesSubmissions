apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      containers:
        - name: the-project
          image: levonml/1.12:latest
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
          - name: shared-logs
            mountPath: /tmp/kube
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: shared-logs-claim