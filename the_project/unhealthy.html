<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5">
    <title>System Failure - Todo App</title>
    <style>
        body {
            align-items: center;
            background: #f8f8f8;
            color: #333;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            text-align: center;
        }

        main {
            background: #fff;
            border-top: 6px solid #ff4d4d;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            padding: 32px;
        }

        h1 {
            color: #c62828;
        }
    </style>
</head>
<body>
    <main>
        <h1>System Failure</h1>
        <p>The todo app is currently unhealthy. Please wait for recovery.</p>
        <p>This page will check again automatically.</p>
    </main>

</html>
