apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - log_outputs/manifests/deployment.yaml
  - log_outputs/manifests/service.yaml
  - log_outputs/manifests/route.yaml
  - log_outputs/manifests/gateway.yaml
  - log_outputs/manifests/configmap.yaml
  - log_outputs/PVs/persistentvolumeclaim-logoutput.yaml
  - log_outputs/PVs/persistentvolume-logoutput.yaml
  - pong-o/manifests/deployment.yaml
  - pong-o/manifests/service.yaml
  #- pong-o/manifests/postgres-stset.yaml
images:
  - name: pong-o
    newName: levonml/4-1-pong-o:latest
  - name: string-writer
    newName: levonml/1.11-writer:latest
  - name: string-reader
    newName: levonml/4-1-reader:latest
