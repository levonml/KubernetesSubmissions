apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - the_project/manifests/configmap.yaml
  - the_project/manifests/deployment.yaml
  - the_project/manifests/gateway.yaml
  - the_project/manifests/route.yaml
  - the_project/manifests/service.yaml
  - the_project/PV/persistentvolumeclaim-the-project.yaml
  - todo-backend/manifests/configmap.yaml
  - todo-backend/manifests/deployment.yaml
  - todo-backend/manifests/service.yaml 
  - todo-backend/manifests/statefulset-postgres.yaml  
  - broadcaster/manifests/deployment.yaml
 # - broadcaster/manifests/secret.yaml
images:
  - name: PROJECT/IMAGE_BACKEND
    newName: levonml/4-6-todo-backend:latest
  - name: PROJECT/IMAGE_FRONTEND
    newName: levonml/4-6-the-project:latest
  - name: PROJECT/IMAGE_BROADCASTER
    newName: levonml/4-6-broadcaster:latest
