name: Build and publish applicationo on Staging

on:
  push:
    branches:
      - main

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: The-project

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish backend
        run: |-
          docker build -f ./base/the_project/Dockerfile_staging --tag "levonml/4-9-the-project-staging:$GITHUB_SHA" ./base/the_project
          docker push "levonml/4-9-the-project-staging:$GITHUB_SHA"
          docker build --tag "levonml/4-9-todo-backend-staging:$GITHUB_SHA" ./base/todo-backend
          docker push "levonml/4-9-todo-backend-staging:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        working-directory: ./overlays/staging
        run: |-
          kustomize edit set image PROJECT/IMAGE_FRONTEND=levonml/4-9-the-project-staging:$GITHUB_SHA
          kustomize edit set image PROJECT/IMAGE_BACKEND=levonml/4-9-todo-backend-staging:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'base/kustomization.yaml'
          message: New staging version released ${{ github.sha }}