name: The Project CI/CD Pipeline

on:
  push:

permissions:
  contents: read

env:
  FRONTEND_IMAGE: levonml/2-10-the-project
  BACKEND_IMAGE: levonml/3-6-todo-backend
  FRONTEND_DEPLOYMENT: the-project
  BACKEND_DEPLOYMENT: todo-backend

jobs:
  build-publish:
    if: github.ref_type == 'branch'
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: The-project
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      namespace: ${{ steps.tag.outputs.namespace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Form image tag and namespace
        id: tag
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then NAMESPACE=project; else NAMESPACE="$GITHUB_REF_NAME"; fi
          echo "tag=$GITHUB_REF_NAME-$GITHUB_SHA" >> $GITHUB_OUTPUT
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend
        run: |
          docker build --tag $FRONTEND_IMAGE:${{ steps.tag.outputs.tag }} ./the_project
          docker push $FRONTEND_IMAGE:${{ steps.tag.outputs.tag }}

      - name: Build and push Backend
        run: |
          docker build --tag $BACKEND_IMAGE:${{ steps.tag.outputs.tag }} ./todo-backend
          docker push $BACKEND_IMAGE:${{ steps.tag.outputs.tag }}

  deploy:
    name: Deploy to k3d
    needs: build-publish
    runs-on: self-hosted
    env:
      TAG: ${{ needs.build-publish.outputs.tag }}
      NAMESPACE: ${{ needs.build-publish.outputs.namespace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          kubectl create namespace $NAMESPACE || true
          kustomize edit set namespace $NAMESPACE
          kustomize edit set image PROJECT/IMAGE_FRONTEND=$FRONTEND_IMAGE:$TAG
          kustomize edit set image PROJECT/IMAGE_BACKEND=$BACKEND_IMAGE:$TAG
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment $FRONTEND_DEPLOYMENT -n $NAMESPACE
          kubectl rollout status deployment $BACKEND_DEPLOYMENT -n $NAMESPACE
          kubectl get services -o wide -n $NAMESPACE