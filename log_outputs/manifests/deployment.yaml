apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: shared-logs-claim
        - name: config-volume
          configMap:
            name: log-output-config-map
            items:
              - key: information.txt
                path: information.txt
      containers:
        - name: string-reader
          image: string-reader
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
          volumeMounts:
          - name: shared-logs
            mountPath: /tmp/kube
          - name: config-volume
            mountPath: /etc/kube/configmap
          env:
          - name: MESSAGE
            valueFrom:
              configMapKeyRef:
                name: log-output-config-map
                key: my-message
        - name: string-writer
          image: string-writer
          volumeMounts:
          - name: shared-logs
            mountPath: /tmp/kube
          