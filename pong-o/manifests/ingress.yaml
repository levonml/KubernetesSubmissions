apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pong-o-ingress
  namespace: exercises
spec:
  rules:
  - http:
      paths:
      - path: /pingpong
        pathType: Prefix
        backend:
          service:
            name: pong-o-svc
            port:
              number: 80
      - path: /showlogs
        pathType: Prefix
        backend:
          service:
            name: log-output-svc
            port:
              number: 2344