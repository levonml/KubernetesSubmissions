apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pong-o
  template:
    metadata:
      labels:
        app: pong-o
    spec:
      containers:
        - name: pong-o
          image: levonml/1.11-pong-o:latest
          volumeMounts:
          - name: shared-logs
            mountPath: /tmp/kube
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: shared-logs-claim