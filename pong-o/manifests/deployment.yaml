apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: pong-o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pong-o
  template:
    metadata:
      labels:
        app: pong-o
    spec:
      containers:
        - name: pong-o
          image: pong-o
          imagePullPolicy: Always
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
          
         