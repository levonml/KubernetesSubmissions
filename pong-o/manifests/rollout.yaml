apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  namespace: exercises
  name: pong-o
spec:
  replicas: 4
  selector:
    matchLabels:
      app: pong-o
  strategy:
    canary:
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: cpu-usage
      - pause:
          duration: 30s
      - setWeight: 50
      - pause:
          duration: 30s
  template:
    metadata:
      labels:
        app: pong-o
    spec:
      containers:
        - name: pong-o
          image: PROJECT/IMAGE_PONG
          volumeMounts:
          - name: pong-count-volume
            mountPath: /tmp/kube
      volumes:
        - name: pong-count-volume
          persistentVolumeClaim:
            claimName: pong-o-claim