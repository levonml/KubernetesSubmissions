apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: google-key
              secret:
                secretName: storage-sa-key
          containers:
            - name: backup
              image: google/cloud-sdk:slim
              volumeMounts:
                - name: google-key
                  mountPath: /var/secrets/google
                  readOnly: true
              env:
                - name: DATABASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: the-project-config-map
                      key: BACKUP_URL
                - name: BUCKET
                  value: "gs://the-project-backup-bucket"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  apt-get update
                  apt-get install -y --no-install-recommends postgresql-client
                  rm -rf /var/lib/apt/lists/*

                  timestamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
                  backup_file="/tmp/postgres-${timestamp}.sql"

                  pg_dump --verbose "$DATABASE_URL" > "$backup_file"

                  gcloud auth activate-service-account \
                    --key-file=/var/secrets/google/key.json

                  gcloud storage cp \
                    "$backup_file" \
                    "$BUCKET/postgres/${timestamp}.sql"