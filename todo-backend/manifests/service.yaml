apiVersion: v1
kind: Service
metadata:
  namespace: project
  name: todo-backend-svc
spec:
  type: ClusterIP
  selector:
    app: todo-backend # This is the app as declared in the deployment.
  ports:
    - protocol: TCP
      port: 2351 # This is a port that is available to the cluster, in this case it can be ~ anything
      targetPort: 3000 # This is the target port