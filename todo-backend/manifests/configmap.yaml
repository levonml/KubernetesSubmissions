apiVersion: v1
kind: ConfigMap
metadata:
  namespace: project
  name: todo-backend-config
data:
  articlescript.sh: |
    #!/bin/sh
    set -e

    RANDOM_URL=$(curl -s -o /dev/null -w "%{redirect_url}" https://en.wikipedia.org/wiki/Special:Random)

    if [ -z "$RANDOM_URL" ]; then
      echo "Failed to get random Wikipedia URL"
      exit 1
    fi

    echo "Got random article: $RANDOM_URL"

    curl -s -X POST "${BACKEND_URL}/todos" \
      -H "Content-Type: application/json" \
      -d "{\"data\": \"${RANDOM_URL}\"}"

    echo "Todo added."